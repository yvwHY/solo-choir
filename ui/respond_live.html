<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solo Choir · Call &amp; Response</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #10141a; color: #cbd5e1; height: 100vh; overflow: hidden;
    font-family: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    display: flex; flex-direction: column; user-select: none;
  }
  /* top bar: params + start/stop */
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px;
         background: #161b23; border-bottom: 1px solid #232b36; flex-wrap: wrap; }
  #bar label { font-size: 11px; color: #64748b; display: flex; flex-direction: column; gap: 2px; }
  #bar input, #bar select { width: 64px; background: #0d1117; color: #e2e8f0;
               border: 1px solid #2b3542;
               border-radius: 6px; padding: 4px 6px; font-size: 13px; }
  #bar select#inname, #bar select#outname { width: 150px; }
  #mapgrp, #bmapgrp { display: flex; gap: 2px; }
  #mapgrp select, #bmapgrp select { width: 46px; }
  button { border: 0; border-radius: 8px; padding: 9px 22px; font-size: 15px; font-weight: 700;
           cursor: pointer; }
  #btnStart { background: #16a34a; color: #fff; }
  #btnStop  { background: #7f1d1d; color: #fecaca; display: none; }
  button:disabled { opacity: .4; cursor: default; }
  .sp { flex: 1; }

  /* main state: readable from 2–3 m away */
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 10px; transition: background .25s;
           position: relative; }
  /* Engine readout row (bank_st / solo_st). The camera view was removed from
     the UI on 2026-08-18, retiring the mouthCam image; to bring it back, use a
     version from before that date. camCap now holds the readout alone and has
     moved to the top-right corner where the camera used to be. */
  #camCap { position: absolute; top: 10px; right: 12px; width: 200px;
            text-align: center; font-size: 11px; color: #7c8ba0; display: none; }
  #state { font-size: clamp(56px, 20vh, 170px); font-weight: 800; letter-spacing: .06em;
           line-height: 1; }
  #sub   { font-size: clamp(14px, 3vh, 24px); color: #7c8ba0; }
  .s-idle   #state { color: #475569; }
  .s-boot   #state { color: #64748b; }
  .s-calq   { background: #1c1210; } .s-calq #state { color: #f87171; }
  .s-cals   { background: #101b12; } .s-cals #state { color: #4ade80; }
  .s-listen { background: #0f1a13; } .s-listen #state { color: #4ade80; }
  .s-render { background: #1b1609; } .s-render #state { color: #fbbf24; }
  .s-play   { background: #0e1620; } .s-play   #state { color: #60a5fa; }
  .s-done   #state { color: #94a3b8; }

  /* single key hint. fixed spot + fixed wording per state, so the eye never
     has to read a sentence to know what one tap does now (08-13 Harry). */
  #tapPill { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
             display: none; align-items: center; gap: 10px;
             background: #171d26; border: 1px solid #2b3542; border-radius: 999px;
             padding: 9px 20px; font-size: clamp(14px, 2.4vh, 20px); font-weight: 600;
             color: #cbd5e1; }
  #tapPill .key { font-size: .72em; font-weight: 700; letter-spacing: .06em;
                  color: #0d1117; background: #cbd5e1; border-radius: 6px;
                  padding: 3px 9px; box-shadow: 0 2px 0 #64748b; }

  #warn { min-height: 22px; padding: 3px 14px; font-size: 13px; color: #fbbf24;
          background: #1b1609; display: none; }

  /* stats row */
  #stats { display: flex; gap: 0; border-top: 1px solid #232b36; background: #161b23; }
  #stats div { flex: 1; text-align: center; padding: 8px 4px; }
  #stats .v { font-size: 20px; font-weight: 700; color: #e2e8f0; }
  #stats .k { font-size: 10px; color: #64748b; margin-top: 1px; }

  /* raw engine log */
  #log { height: 120px; overflow-y: auto; background: #0b0e13; border-top: 1px solid #232b36;
         font: 10.5px/1.5 "SF Mono", Menlo, monospace; padding: 6px 10px; color: #55657a;
         white-space: pre-wrap; user-select: text; }
  #log .w { color: #fbbf24; }
</style>
</head>
<body class="s-idle">
  <div id="bar">
    <label>mode<select id="mode">
      <option value="respond">Respond</option>
      <option value="stream">Live</option>
      <option value="duo">Live + neural</option>
      <option value="solo">Live · neural</option>
    </select></label>
    <label>gain<input id="gain" value="0.5"></label>
    <label>gap s<input id="gap" value="1.2"></label>
    <label>neural<input id="ngain" value="" placeholder="1｜duo .25"></label>
    <label>bank<input id="bankgain" value="" placeholder="1｜duo .5"></label>
    <label>you<input id="yougain" value="" placeholder=".3"></label>
    <label>stab<input id="stab" value="1"></label>
    <label>key<input id="key" value="auto"></label>
    <label>mic<select id="inname"></select></label>
    <label>out<select id="outname"></select></label>
    <label>map D·U·L·S<span id="mapgrp">
      <select id="mapd"></select><select id="mapu"></select><select id="mapl"></select><select id="maps"></select>
    </span></label>
    <label>map B·T·A·S<span id="bmapgrp">
      <select id="bmapb"></select><select id="bmapt"></select><select id="bmapa"></select><select id="bmaps"></select>
    </span></label>
    <label>max-min<input id="maxmin" value="40"></label>
    <label>reverb<input id="reverb" value="0.20"></label>
    <label>tail s<input id="tails" value="0"></label>
    <span class="sp"></span>
    <button id="btnStart">Start</button>
    <button id="btnStop">Stop</button>
  </div>

  <div id="stage">
    <div id="state">IDLE</div>
    <div id="sub">Press Start — models take ~10 s to load</div>
    <div id="camCap"></div>
    <div id="tapPill"><span class="key" id="tapKey">SPACE</span><span id="tapVerb"></span></div>
  </div>
  <div id="warn"></div>

  <div id="stats">
    <div><div class="v" id="stPhr">–</div><div class="k">PHRASES</div></div>
    <div><div class="v" id="stWait">–</div><div class="k">LAST WAIT s</div></div>
    <div><div class="v" id="stKey">–</div><div class="k">KEY</div></div>
    <div><div class="v" id="stSep">–</div><div class="k">SEPARATION dB</div></div>
    <div><div class="v" id="stIo">–</div><div class="k">IO OVER/UNDER</div></div>
  </div>
  <div id="log"></div>

<script>
const $ = id => document.getElementById(id);
let playTimer = null;
let curMode = null;      // the mode the engine is really running; updated by switched and Start, null before the piece starts

// What one tap does, per state. Derived from the state class so every setState
// call gets the right hint automatically; states absent here = tap does nothing
// = pill hidden (better than a hint that lies).
const TAP_VERB = { listen: 'end phrase', render: 'cancel, keep singing', play: 'skip' };

// The engine's [tap] line could be shown whole, but it is written for the log
// panel and is too long for someone standing and singing, so the status bar
// keeps one sentence. gap prints the value the engine actually applied, so the
// display is honest. Anything unrecognised passes through unchanged.
function tapText(s) {
  const g = (s.match(/gap ([\d.]+)s/) || [])[1];
  if (s.startsWith('connected'))
    return 'Key connected — you end each phrase' + (g ? ' (auto after ' + g + ' s)' : '');
  if (s.startsWith('disconnected'))
    return 'Key disconnected — phrases end after ' + (g || '?') + ' s of silence';
  return s;
}

function setState(cls, word, sub) {
  document.body.className = 's-' + cls;
  $('state').textContent = word;
  $('sub').textContent = sub || '';
  const verb = TAP_VERB[cls] || '';
  $('tapVerb').textContent = verb;
  // The pill appears only in modes where there is a phrase to end. The
  // listen, render and play states are used by all four modes, but the sampler
  // and neural modes have no phrase ending, so leaving it there would be a
  // false prompt. The rule set on 2026-08-13: anything not in the table is
  // hidden outright; better no prompt than a false one.
  updatePill();
}
function updatePill() {          // recompute whenever either the mode or the state changes
  const cls = document.body.className.replace(/^s-/, '');
  const verb = TAP_VERB[cls] || '';
  const keyed = $('mode').value === 'respond' || $('mode').value === 'both';
  $('tapPill').style.display = (verb && keyed) ? 'flex' : 'none';
}
// Each field applies only in certain modes; which _spawn_* method on the shell
// side reads it decides that, checked field by field in the audit of
// 2026-08-18. In other modes the field greys out and locks. Adjusting something
// and seeing no response looks broken, which is the cardinal sin of this app;
// the same rule already governs the mode drop-down and tapPill. The value is
// kept, and applies again as soon as a mode that uses it is selected.
const FIELD_MODES = {
  gain: ['respond'], gap: ['respond'], stab: ['respond'],
  maxmin: ['respond'], reverb: ['respond'], tails: ['respond'],
  // Channel routing (decided 2026-08-18): D-U-L-S is respond's dry, upper,
  // lower and S; under neural it is dry, roof, bass and middle. B-T-A-S is the
  // sampled choir's four parts (bass, tenor, alto, soprano).
  mapgrp: ['respond', 'solo', 'duo'],
  bmapgrp: ['stream', 'duo'],
  ngain: ['solo', 'duo'], yougain: ['solo', 'duo'],
  bankgain: ['stream', 'duo'],
  key: ['respond', 'solo', 'duo'],
};
function applyRelevance() {       // recompute whenever the mode drop-down changes, in step with updatePill
  const m = $('mode').value;
  for (const [id, modes] of Object.entries(FIELD_MODES)) {
    const on = modes.includes(m), el = $(id);
    el.closest('label').style.opacity = on ? '' : '.35';
    // disabled locks the input without clearing the value. The map groups are
    // a span wrapping four selects, and disabling the span itself does nothing,
    // so each select inside has to be locked; bmapgrp taught that lesson.
    const kids = el.querySelectorAll('select');
    (kids.length && el.tagName === 'SPAN' ? [...kids] : [el])
      .forEach(x => { x.disabled = !on; });
  }
}
// key=auto means something only in respond, where the key is really tracked
// phrase by phrase. neural (solo and duo) accepts only the key names C..B, and
// the shell silently downgrades anything else to C in
// respond_shell._spawn_solo. That downgrade has to be said out loud, or someone
// singing in another key gets every chord wrong all evening without knowing
// why (audit, 2026-08-18).
function warnKeyDowngrade() {
  const m = $('mode').value, k = $('key').value.trim();
  if ((m === 'solo' || m === 'duo') && k && !/^[A-Ga-g][#b]?$/.test(k))
    warn("key '" + k + "' only works in Respond — neural modes fall back to C (type a key name)");
}
function warn(msg) {              // latest warning stays until the next one
  $('warn').style.display = 'block';
  $('warn').textContent = msg;
}
function log(line, isWarn) {
  const el = $('log');
  const d = document.createElement('div');
  if (isWarn) d.className = 'w';
  d.textContent = line;
  el.appendChild(d);
  while (el.childNodes.length > 400) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

let keyIsUdp = false;    // the engine fell back to UDP, so what is pressed is the app's space key; see below
let keyIsBle = false;    // the Bluetooth button is connected (2026-08-25, see below)
window.respTele = ev => {
  // The frame event is retired, with the camera removed on 2026-08-18. On
  // 2026-08-25: the two Bluetooth button messages, connected and disconnected,
  // are pushed by the shell directly and carry no line field, so the old code
  // called log(undefined) and printed "undefined" in the message area. With no
  // line, fall back to m[0]: those two become a readable line, and whether the
  // button is connected becomes something the message area can answer. With
  // neither, print nothing.
  const logLine = ev.line || (ev.m || [])[0];
  if (logLine) log(logLine, ev.kind === 'warn');
  const m = ev.m || [];
  // The word on the key cap means which source the engine is really listening
  // to, not whether something is connected.
  // Lesson of 2026-08-14: `[tap] connected` only means a signal is arriving,
  // and with no Pico plugged in that signal is the app's own UDP heartbeat
  // every 2 s. Treating it as "the physical button is connected" makes the
  // screen say TAP while the finger is pressing Space. When the engine falls
  // back to UDP it prints "(app space key)" in the message area; use that
  // marker, because it is the engine stating its source.
  // Lesson of 2026-08-25: the Bluetooth button travels this same UDP path, as
  // the shell forwards a BLE TAP over UDP (see _ble_key in respond_shell), so
  // the engine always prints "app space key". That sentence is about which port
  // the engine listens on, not about whether a physical button exists, so a
  // connected BLE button must override it. Otherwise the button is in hand and
  // the screen says SPACE for ever, which was found the day before the viva.
  if (ev.kind === 'tap' && m[0] && m[0].indexOf('BLE key') >= 0) {
    keyIsBle = m[0].startsWith('connected');
    $('tapKey').textContent = keyIsBle ? 'BUTTON' : 'SPACE';
  }
  if (!keyIsBle && ev.line && ev.line.indexOf('app space key') >= 0) {
    keyIsUdp = true;
    $('tapKey').textContent = 'SPACE';
  }
  // not fallen back to UDP and the button is alive: a real physical button over serial
  if (!keyIsUdp && !keyIsBle && ev.kind === 'tap' && m[0] && m[0].startsWith('connected'))
    $('tapKey').textContent = 'BUTTON';
  switch (ev.kind) {
    case 'switching': // keys 1-4 change mode: the new engine is starting while the old one still sings, so there is no gap
      // Matured on 2026-08-17: the screen has to respond at the moment of the
      // click. The large text goes to SWITCHING, the old engine's readout is
      // cleared at once, with the shell stopping the old engine from driving
      // the UI, and the drop-down locks until the switch ends. The old engine
      // still sings until the new one is ready, so the sound stays seamless.
      $('mode').disabled = true;
      $('camCap').style.display = 'none';
      $('camCap').textContent = '';
      setState('boot', 'SWITCHING…',
               m[0] + ' is loading — quiet until it is ready');
      break;
    case 'switch_fail': { // the switch died or timed out; the old engine stopped at the click, so everything stops and returns to Start
      $('mode').disabled = false;
      clearTimeout(playTimer);
      curMode = null;
      setState('done', 'ENDED', 'switch failed — press Start');
      $('btnStart').style.display = ''; $('btnStop').style.display = 'none';
      $('btnStop').disabled = false;
      break;
    }
    case 'switched':  // the new engine has reported ready and the old ones have retired
      curMode = m[0];                // remember the real mode on the JS side, for restoring the drop-down
      $('mode').disabled = false;
      $('mode').value = m[0];        // the drop-down follows, so the screen cannot disagree with reality
      $('sub').textContent = 'now ' + m[0];
      updatePill();                  // the new mode may have no phrase key, so the pill is hidden
      applyRelevance();              // grey and active fields follow the new mode
      warnKeyDowngrade();            // solo and duo downgrade auto or an odd value to C, which must be said
      // The respond-only statistics (phrase count, wait, key, separation, IO)
      // do not carry across engines. Leaving them on a switch would freeze the
      // previous run's numbers and let them read as current (audit item 4,
      // 2026-08-18). Switching back to respond, the new engine refills them.
      ['stPhr', 'stWait', 'stKey', 'stSep', 'stIo']
        .forEach(id => { $(id).textContent = '–'; });
      // Clear the old engine's readout. respond has no readout row, and a new
      // bank or solo engine reopens it on its next bank_st or solo_st frame.
      // Found on 2026-08-17: once exit was downgraded, the path that used to
      // clear the screen through exit was broken, and switching to respond left
      // a frozen readout.
      $('camCap').style.display = 'none';
      $('camCap').textContent = '';
      break;
    case 'solo_on':   // neural live (solo_min): two converted parts plus the dry voice, three in all
      setState('listen', 'SING', 'Neural voices — soprano + bass follow you');
      break;
    case 'solo_st':   // cumulative xruns; a steady rise means the CPU cannot keep up, not start-up jitter
      $('camCap').style.display = 'block';
      $('camCap').textContent = 'xrun ' + m[0];
      if (parseInt(m[0]) > 20) warn('Neural mode xruns ' + m[0] + ' — audio may break up');
      break;
    case 'bank_on':   // in the both mode, do not cover respond's status text; bank is the supporting part
      if ($('mode').value !== 'both')
        setState('listen', 'SING', 'Sampler bank — choir follows you (~60 ms)');
      break;
    case 'bank_st': { // note N, cents +/-C, gate open/closed, xrun X, [backlog B[/dropped D]]
      // Review #2, 2026-08-17: after --frame-b64 0, only frame and solo_st
      // unhid the element, so bank mode wrote its readout into something with
      // display:none, leaving no live readout on stage at all. That breaks the
      // rule that anything not on the status bar may as well not exist. It
      // unhides itself here, as solo_st does.
      $('camCap').style.display = 'block';
      // The engine still prints the field name mouth in m[2], but since
      // 2026-08-18 it reports the microphone gate (M.eff) and has nothing to do
      // with the mouth or the camera, so the screen calls it gate.
      $('camCap').textContent = 'pitch ' + m[0] + ' · gate ' + m[2] +
                                ' · xrun ' + m[3] +
                                (m[5] ? ' · drop ' + m[5] : '');
      // dropped is the only instrument that sees audio being lost (F25). A
      // steady rise means the CPU cannot keep up, most likely in the duo mode,
      // and every drop is a 35 ms hole.
      if (m[5] && parseInt(m[5]) > 5)
        warn('Sampler dropped ' + m[5] + ' blocks (35 ms holes) — CPU may not keep up');
      // GATE DEAD and WORKER DEAD at the end of the line are claimed by
      // bank_st first, so the warn pattern never sees them. Sniff the raw line
      // instead, so the large warning bar does not miss them.
      if (ev.line.indexOf('GATE DEAD') >= 0)
        warn('⚠ mouth gate DEAD — running ungated (PA volume is the only guard)');
      if (ev.line.indexOf('WORKER DEAD') >= 0)
        warn('⚠ audio worker DEAD — output is silent, restart the engine');
      break;
    }
    case 'boot':      setState('boot', 'LOADING', ev.line); break;
    case 'cal_quiet': setState('calq', 'QUIET', 'Measuring noise floor — 3 s, stay silent'); break;
    case 'cal_sing':  setState('cals', 'SING 5 s', 'Performance volume'); break;
    case 'sep':       $('stSep').textContent = m[0]; break;
    case 'key':       $('stKey').textContent = ev.line.replace(/^\[key\] /, '')
                        .replace(/\(.*$/, '').replace(/^.*--key /, '').trim(); break;
    case 'live':      setState('listen', 'SING', ''); break;
    case 'stream_on': setState('listen', 'SING', 'Live mode — choir follows you'); break;
    case 'stream_st': {          // infer p50 / missing blocks / flags
      $('stWait').textContent = (parseInt(m[0]) / 1000).toFixed(2);
      $('stIo').textContent = m[1] + '/' + m[2];
      if (parseInt(m[1]) > 10) warn('Stream dropouts ' + m[1] + ' — output may break up');
      break;
    }
    case 'listen': {  // heartbeat line = back to singable (also corrects the PLAY countdown)
      clearTimeout(playTimer); playTimer = null;
      setState('listen', 'SING', '');
      $('stPhr').textContent = m[1];
      $('stIo').textContent = m[2] + '/' + m[3];
      break;
    }
    case 'render':    setState('render', 'HOLD', 'Rendering…'); break;
    case 'phrase': {  // response starts. silence ≈ response length + pause + tail
      $('stPhr').textContent = m[0];
      $('stWait').textContent = m[2];
      setState('play', 'RESPONSE', 'Listen');
      clearTimeout(playTimer);
      playTimer = setTimeout(() => setState('listen', 'SING', ''),
                             (parseFloat(m[1]) + 0.7) * 1000);
      break;
    }
    case 'tap':       // button state on the status bar; the key cap text is decided by keySrc, see above
      $('sub').textContent = tapText(m[0]);
      break;
    case 'warn':      warn(ev.line.trim()); break;
    case 'dump':      log('dump → ' + m[0]); break;
    // The engine's closing line is long; the statistics can stay in the log
    // area, and the status bar reports only the phrase count.
    case 'done':      setState('done', 'ENDED',
                               m[0] ? m[0] + ' phrases' : ev.line); break;
    case 'exit': {
      // Review S1: in the both mode, when one engine dies while the other is
      // still singing, the button must not return to Start; that would be a
      // false ENDED plus an orphan, since Start is blocked by running() and
      // Stop has disappeared. ev.still is the shell reporting that an engine is
      // still alive.
      if (ev.who === 'bank' || !ev.still) {       // review B6: respond died while bank
        $('camCap').style.display = 'none';       // is still alive, so keep the readout visible
        $('camCap').textContent = '';
      }
      if (ev.still) {
        warn((ev.who || 'engine') + ' exited first — another engine is still running; '
             + 'Stop clears everything');
        break;
      }
      clearTimeout(playTimer);
      curMode = null;                             // everything retired, so there is no real mode
      $('mode').disabled = false;                 // do not let the lock persist into the next run
      if (!document.body.className.includes('done'))
        setState('done', 'ENDED', ev.line);
      $('btnStart').style.display = ''; $('btnStop').style.display = 'none';
      $('btnStop').disabled = false;              // usable again next time
      break;
    }
  }
};

async function loadDevices() {
  // Microphone and output drop-downs, added on 2026-08-05 because typing them
  // was awkward. The whole device name goes into --in-name and --out-name; the
  // respond2 side matches on the string, so a full name always hits. The first
  // output entry is the system default.
  try {
    const dv = await window.pywebview.api.devices();
    const fill = (el, names, extra) => {
      el.innerHTML = '';
      (extra ? [extra] : []).concat(names).forEach(n => {
        const o = document.createElement('option');
        o.value = n === 'default' ? '' : n;
        o.textContent = n;
        el.appendChild(o);
      });
    };
    fill($('inname'), dv['in'] || []);
    outDevs = dv['out'] || [];
    fill($('outname'), outDevs.map(o => o.name), 'default');
    const pre = (dv['in'] || []).find(n => n.includes('AI-Micro'));
    if (pre) $('inname').value = pre;
    fillMap();
  } catch (e) { warn('Could not load the device list: ' + e); }
}

let outDevs = [];
function fillMap() {
  // The D/U/L/S channel drop-downs: the number of options is the real channel
  // count of the selected output device, defaulting to 8. Leaving them all on
  // the dash means no routing, a single mix. S may stay on the dash, sharing a
  // channel with upper, which is respond2's default.
  const dev = outDevs.find(o => o.name === $('outname').value);
  const ch = dev ? dev.ch : 8;
  ['mapd', 'mapu', 'mapl', 'maps',
   'bmapb', 'bmapt', 'bmapa', 'bmaps'].forEach(id => {
    const el = $(id), prev = el.value;
    el.innerHTML = '';
    const dash = document.createElement('option');
    dash.value = ''; dash.textContent = '—';
    el.appendChild(dash);
    for (let c = 0; c < ch; c++) {
      const o = document.createElement('option');
      o.value = String(c); o.textContent = String(c);
      el.appendChild(o);
    }
    if ([...el.options].some(o => o.value === prev)) el.value = prev;
  });
}
$('outname') && ($('outname').onchange = fillMap);

function mapValue() {
  const mv = ['mapd', 'mapu', 'mapl'].map(i => $(i).value);
  if (mv.some(v => v === '')) return '';        // D/U/L not all set: no routing
  const s = $('maps').value;
  return mv.join(',') + (s !== '' ? ',' + s : '');
}
function bankMapValue() {
  // bank's four parts (B-T-A-S, the engine's VOICES order). All four must be
  // set to route, because the engine requires one channel per part; anything
  // less returns empty and the original stereo mix runs.
  const mv = ['bmapb', 'bmapt', 'bmapa', 'bmaps'].map(i => $(i).value);
  return mv.some(v => v === '') ? '' : mv.join(',');
}
window.addEventListener('pywebviewready', loadDevices);
if (window.pywebview) loadDevices();
applyRelevance();   // grey out by the default mode from the start; under respond the neural,
                    // bank and you fields are greyed

// space acts as the physical button when no Pico is attached: the shell turns
// it into a UDP TAP, which respond2 receives over the same protocol.
// The button counts as present only while the window has focus; losing focus
// stops the heartbeat, and after 6 s the engine returns to energy-only phrase
// detection.
// Keys 1-4 change mode seamlessly during a performance: the new engine starts
// and the old one is stopped only once it is ready, so there is no gap.
// Both share one keydown handler, because the form guard below applies to both.
// Key 3 used to be Respond+Live; it was dropped on 2026-08-14 and became
// Live+neural, the sampled four parts and the two neural parts sounding
// together. The both mechanism is still in the code, and bringing it back is
// one added option.
const MODE_KEY = {Digit1: 'respond', Digit2: 'stream',
                  Digit3: 'duo', Digit4: 'solo'};
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const t = e.target && e.target.tagName;
  if (t === 'SELECT' || t === 'INPUT' || t === 'BUTTON') return;  // do not steal keys from a form control
  if (e.code === 'Space') {
    e.preventDefault();
    if (window.pywebview) window.pywebview.api.tap();
    return;
  }
  const m = MODE_KEY[e.code];
  if (!m || !window.pywebview) return;
  e.preventDefault();
  window.pywebview.api.switch_mode(m, opts());
});
// Changing the mode drop-down with the mouse during a performance switches
// directly, on the same path as keys 1-4.
// 2026-08-14: keys 1-4 are for the performer, but anyone who has not used this
// app reaches for the drop-down, and clicking it used to do nothing at all;
// Stop, change, Start was required, which looks broken.
// Note that setting .value from code, on the switched event, does not fire
// change, so this cannot recurse.
// Before the piece starts, switch_mode returns False on its own as a back-end
// guard, and the drop-down value is simply kept for Start. The front end must
// not test "is it running" a second time; that gets tangled with CSS and inline
// style, since btnStop is hidden by CSS and its inline style is an empty string
// rather than 'none'.
$('mode').onchange = async () => {
  if (!window.pywebview) return;
  const ok = await window.pywebview.api.switch_mode($('mode').value, opts());
  // Review #18, 2026-08-17: the blur is required. The comment on the blur in
  // btnStart.onclick (review A8, 2026-08-12) describes this bug: while a
  // <select> holds focus, the form guard in keydown swallows Space and 1-4
  // while the pill still reads "SPACE - end phrase". On stage, Space does
  // nothing, every phrase has to wait the 6 s gap, and the app looks hung.
  if (document.activeElement) document.activeElement.blur();
  // A refused switch, during another switch or after a timeout, must not leave
  // the drop-down on a mode no engine is running, or the screen lies and a
  // later Stop then Start opens the wrong engine. Before the piece starts, with
  // curMode null, the value is kept for Start; the back end refuses by design
  // and that is not an error.
  if (!ok && curMode) $('mode').value = curMode;
  applyRelevance();   // whether it succeeded, was refused or was restored, the grey and active
                      // fields always match the drop-down's current value
};
window.addEventListener('focus', () => window.pywebview && window.pywebview.api.tap_presence(true));
window.addEventListener('blur',  () => window.pywebview && window.pywebview.api.tap_presence(false));
window.addEventListener('pywebviewready', () => window.pywebview.api.tap_presence(document.hasFocus()));

// Start and a mode change read the fields through the same code, so the number
// on screen is always the one really in force. Written twice, one copy would
// eventually fall behind, which is exactly the class of bug fixed that
// afternoon.
function opts() {
  return {
    mode: $('mode').value,
    gain: $('gain').value, stab: $('stab').value, key: $('key').value,
    in_name: $('inname').value, out_name: $('outname').value,
    out_map: mapValue(), bank_map: bankMapValue(), max_min: $('maxmin').value,
    reverb: $('reverb').value, tail_s: $('tails').value,
    gap: $('gap').value,      // seconds of silence that end a phrase; the engine default of 0.35 cuts too soon
    ngain: $('ngain').value,     // level of the neural parts; Live+neural pulls this down, see the shell
    bank_gain: $('bankgain').value,  // sampler output level; the balance control for
                                     // bank covering neural in duo (2026-08-18).
                                     // 1 is the value that passed by ear.
    you_gain: $('yougain').value };  // 0 stops your microphone passing through to the speakers, which is the echo source
}
$('btnStart').onclick = async () => {
  const ok = await window.pywebview.api.start(opts());
  if (ok) {
    curMode = $('mode').value;       // the piece has started, so this is the real mode
    $('warn').style.display = 'none';
    warnKeyDowngrade();              // check after clearing the old warning, or the line above covers it
    $('btnStart').style.display = 'none';
    $('btnStop').style.display = 'inline-block';   // '' would fall back to CSS display:none
    $('btnStop').disabled = false;                 // the lock left over from the previous Stop
    // If focus stays in the drop-down or input just used, space is swallowed
    // by the form guard in keydown above, and the key silently stops working
    // once the piece has started (review A8, 2026-08-12). Starting takes focus
    // away.
    if (document.activeElement) document.activeElement.blur();
  } else {
    // Review S1: a start refused by the shell, because an engine is still
    // alive, must not be silent.
    warn('An engine is still running — Stop it (or wait for it to finish) before Start');
    $('btnStop').style.display = 'inline-block';
    $('btnStop').disabled = false;
  }
};
$('btnStop').onclick = () => {
  // Guard against double clicks: STOPPING can last up to 8 s when closing a
  // CoreAudio stream hangs, and a person will certainly press again, while a
  // second SIGINT would land in the sf.write that is writing the dump (review
  // A7, 2026-08-12).
  if ($('btnStop').disabled) return;
  $('btnStop').disabled = true;
  window.pywebview.api.stop();
  setState('done', 'STOPPING…', 'writing session dump');
};
</script>
</body>
</html>
